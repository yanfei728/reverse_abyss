<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reverse_abyss · 开发试玩</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; color: #cfd8ea;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16/9; }
  #dev-canvas { display: block; width: 100%; height: 100%; background: #05060c;
    image-rendering: pixelated; outline: none; }
  #hud { position: absolute; left: 12px; top: 10px; font-size: 12.5px; line-height: 1.5;
    color: #dfe7f5; background: rgba(8, 11, 20, .72); border: 1px solid #26324a;
    border-radius: 8px; padding: 6px 10px; pointer-events: none; max-width: 70%; }
  #dev-status { position: absolute; left: 12px; bottom: 10px; font-size: 12px;
    color: #8fa0c0; background: rgba(8, 11, 20, .6); border-radius: 8px; padding: 4px 9px;
    pointer-events: none; }
  #controls { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px; }
  #controls a, #controls button {
    font: inherit; font-size: 12px; color: #cfd8ea; background: #121a2b;
    border: 1px solid #2c3752; border-radius: 8px; padding: 5px 9px;
    text-decoration: none; cursor: pointer;
  }
  #controls a:hover, #controls button:hover { border-color: #4a5f8f; }
  #pause-overlay { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; background: rgba(4, 6, 12, .72); z-index: 5; }
  #pause-overlay .box { background: #10131f; border: 1px solid #2c3752; border-radius: 12px;
    padding: 18px 22px; text-align: center; min-width: 260px; }
  #pause-overlay h2 { margin: 0 0 8px; font-size: 18px; }
  #pause-overlay p { margin: 6px 0 14px; color: #9fb0cc; font-size: 12.5px; }
  #pause-overlay button { font: inherit; margin: 0 4px; padding: 7px 14px; border-radius: 8px;
    background: #1d283d; color: #e8eefb; border: 1px solid #40557f; cursor: pointer; }
  #dev-error { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 640px; padding: 18px 20px; background: #2a1414; border: 1px solid #7a3838;
    color: #ffb3a6; border-radius: 10px; font-size: 13px; line-height: 1.6; z-index: 10; }
  #help { position: absolute; right: 12px; bottom: 10px; font-size: 11.5px; color: #7787a6;
    background: rgba(8, 11, 20, .6); border-radius: 8px; padding: 4px 9px; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="dev-canvas" width="960" height="540"></canvas>
    <div id="hud">正在启动开发试玩…</div>
    <div id="dev-status"></div>
    <div id="help">A/D 或 ←/→ 移动 · Space/W/↑ 跳跃(可二段) · P/Esc 暂停 · R 重开</div>
    <div id="controls">
      <button id="btn-pause" title="P / Esc">暂停</button>
      <button id="btn-restart" title="R">重开</button>
      <a href="editor.html" title="回到编辑器(草稿已保存)">← 编辑器</a>
      <a href="index.html" title="回旧原型主菜单">回游戏</a>
    </div>
    <div id="pause-overlay">
      <div class="box">
        <h2>已暂停</h2>
        <p id="pause-reason">手动暂停</p>
        <button id="btn-resume">继续</button>
        <button id="btn-restart-pause">重开本局</button>
      </div>
    </div>
    <div id="dev-error"></div>
  </div>
</div>

<!-- 引擎 + 新运行时(顺序和 tools/loader.mjs 的 ENGINE 一致) -->

<script src="js/entities/blink.js"></script>
<script src="js/monsters.js"></script>

<script src="js/devplay.js"></script>
</body>
</html>
