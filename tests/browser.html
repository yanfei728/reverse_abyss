  <h1>reverse_abyss 自检</h1>
  <p>
    这个页面就是 <code>node tools/test_engine.mjs</code> 在浏览器里跑的那一份
    (物理、机关、关卡数据、塔的结构、关卡池逐跳可达性、绘制冒烟、关卡切换的渐入渐出)。跑完底下会出现
    <code>SELFTEST OK</code> 或 <code>SELFTEST FAIL</code>。
    想跑快一点(跳过逐跳物理模拟):<code>browser.html?fast=1</code>
  </p>
